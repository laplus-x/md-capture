<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>md-capture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>md-capture</h1>
        <button id="convert-btn">Convert current page</button>
      </header>
      <div id="status" class="status idle">Ready</div>
      <pre id="output" aria-label="Markdown output"></pre>
      <div id="actions">
        <button id="copy-btn" disabled>Copy</button>
        <button id="retry-btn" class="hidden">Retry</button>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
