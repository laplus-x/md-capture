<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>md-capture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <div class="toolbar">
        <div class="brand">md-capture</div>
        <button id="convert-btn" aria-label="Convert current page to Markdown">Convert</button>
      </div>
      <div id="status" class="status idle" role="status" aria-live="polite">Ready</div>
      <div class="workspace">
        <textarea
          id="output"
          aria-label="Markdown output"
          readonly
          placeholder="Markdown will appear here after conversion"
        ></textarea>
        <div class="workspace-actions">
          <button id="copy-btn" disabled>Copy</button>
          <button id="retry-btn" class="hidden">Retry</button>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
